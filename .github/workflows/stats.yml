name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          username = "PythosX"

          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "PythosX-Stats"
          }

          def request(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Repository count
          user = request(f"https://api.github.com/users/{username}")
          repos = user["public_repos"]

          # Count commits across repositories
          page = 1
          total_commits = 0

          while True:
              url = (
                  f"https://api.github.com/search/commits"
                  f"?q=author:{username}&per_page=100&page={page}"
              )

              data = request(url)

              total_commits = data["total_count"]
              break

          print("Repositories:", repos)
          print("Total commits:", total_commits)

          os.makedirs("stats", exist_ok=True)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150">
            <rect width="700" height="150" rx="15" fill="#0d1117"/>

            <text x="175" y="45"
                  fill="#ffffff"
                  font-family="Arial"
                  font-size="16"
                  text-anchor="middle">
              TOTAL COMMITS
            </text>

            <text x="175" y="100"
                  fill="#00e5ff"
                  font-family="Arial"
                  font-size="42"
                  font-weight="bold"
                  text-anchor="middle">
              {total_commits}
            </text>

            <line x1="350" y1="25" x2="350" y2="125"
                  stroke="#30363d"/>

            <text x="525" y="45"
                  fill="#ffffff"
                  font-family="Arial"
                  font-size="16"
                  text-anchor="middle">
              REPOSITORIES
            </text>

            <text x="525" y="100"
                  fill="#00e5ff"
                  font-family="Arial"
                  font-size="42"
                  font-weight="bold"
                  text-anchor="middle">
              {repos}
            </text>
          </svg>'''

          with open("stats/github-stats.svg", "w") as f:
              f.write(svg)
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats/github-stats.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats"

          git push
